spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-interview-coach
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_interview_coach}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}
  judge0:
    base-url: ${JUDGE0_BASE_URL:https://ce.judge0.com}
    api-key: ${JUDGE0_API_KEY:}
    api-host: ${JUDGE0_API_HOST:}
